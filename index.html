<style>
/* Design: a native iPhone tool. The colours are iOS's own dark-mode greys, so the app sits on the phone
   like it belongs there, and the footage is the most colourful thing on screen. One accent, jade, marks
   what you act on and what is protected. The system font for English, IBM Plex Sans Arabic for Arabic.
   No gradients, glows or ornaments: hierarchy comes from size, weight and grey levels. */
:root{
  --bg:#000; --stage:#000; --panel:#1c1c1e; --raised:#2c2c2e; --raised-2:#3a3a3c; --raised-3:#48484a;
  --line:rgba(84,84,88,.34); --line-2:rgba(84,84,88,.62);
  --text:#fff; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.36);
  --accent:#16a06a; --accent-ink:#fff; --accent-text:#3fd39a; --accent-soft:rgba(63,211,154,.13); --accent-line:rgba(63,211,154,.55);
  --danger:#ff453a; --danger-soft:rgba(255,69,58,.12);
  /* older names, kept so every part of the app shares one palette */
  --sand:var(--accent-text); --sand-ink:#fff; --sand-soft:var(--accent-soft); --sand-line:var(--accent-line);
  --palm:var(--accent-text); --palm-soft:var(--accent-soft); --rose:var(--danger); --rose-soft:var(--danger-soft);
  --t-cap:#2b4a63; --t-text:#5a4a2c; --t-blur:#1f4a3a;
  --ui:"Baloo 2","Baloo Bhaijaan 2",system-ui,sans-serif;
  --ui-ar:"Baloo Bhaijaan 2","Baloo 2",system-ui,sans-serif;
  --r:12px; --r-sm:10px; --r-lg:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--ui);overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea{font-family:var(--ui-ar);letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px} svg.i.l{width:28px;height:28px}
[dir=rtl] .flip{transform:scaleX(-1)}
.fwd{transform:scaleX(-1)} [dir=rtl] .fwd{transform:none}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:560px){.app{border-inline:1px solid var(--line)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--raised);font-weight:500;font-size:16px;white-space:nowrap}
.btn:active{background:var(--raised-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:active{background:#128a5b}
.btn.ghost{background:transparent;color:var(--accent-text);font-weight:500}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:17px;font-weight:600}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;gap:5px;border-radius:9px}
.btn:disabled{opacity:.35;pointer-events:none}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:var(--text)}
.icon-btn:active{background:var(--raised)}
.icon-btn:disabled{opacity:.25}

.loader{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--raised-3);border-top-color:var(--text);animation:turn .8s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loader{animation-duration:2.4s}}

/* ---------- HOME ---------- */
.home{flex:1;overflow:auto;padding:calc(8px + var(--sat)) max(16px,var(--sar)) calc(40px + var(--sab)) max(16px,var(--sal))}
.home-top{display:flex;align-items:center;justify-content:flex-end;gap:6px;height:44px}
.lang{display:flex;background:var(--panel);border-radius:9px;padding:2px}
.lang button{min-width:40px;height:30px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);padding:0 8px}
.lang button.on{background:var(--raised-2);color:var(--text)}
.home h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em;margin:2px 0 14px}
[dir=rtl] .home h1{font-size:32px}
.new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:600}
.new:active{background:#128a5b}
.new:disabled{background:var(--raised);color:var(--muted)}
.new .loader{width:20px;height:20px;border-width:2px}
.privacy{display:flex;gap:8px;align-items:flex-start;margin:12px 4px 0;font-size:13px;color:var(--muted);line-height:1.35}
.privacy svg{color:var(--accent-text);margin-top:-1px}
.privacy button{color:var(--accent-text)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 4px 10px}
.sec h2{font-size:22px;font-weight:700;margin:0;letter-spacing:.005em}
.sec span{color:var(--faint);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.pc{position:relative}
.pc .th{display:block;width:100%;aspect-ratio:4/5;background:#1c1c1e center/cover;position:relative;border-radius:12px;overflow:hidden}
.pc .th .dur{position:absolute;inset-inline-end:7px;bottom:7px;font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff}
.pc .meta{display:flex;align-items:flex-start;gap:2px;padding:7px 0 0 2px}
.pc .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .mt{color:var(--muted);font-size:13px}
.pc .meta .grow{flex:1;min-width:0;text-align:start}
.pc .icon-btn{width:34px;height:34px;color:var(--muted)}
.pc .confirm{position:absolute;inset:0 0 auto 0;aspect-ratio:4/5;border-radius:12px;background:rgba(0,0,0,.86);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:14px;text-align:center;font-size:15px}

.tlwrap{flex:none;position:relative;height:clamp(150px,27vh,240px);direction:ltr;background:#0b0b0c;border-top:1px solid var(--line)}

.part .kf{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#fff;transform:rotate(45deg);box-shadow:0 0 0 1.5px #000;pointer-events:none}

.tip{flex:none;margin:8px max(12px,var(--sar)) 0 max(12px,var(--sal));display:flex;gap:10px;align-items:center;padding:8px 6px 8px 12px;border-radius:12px;background:var(--panel);font-size:14px;color:var(--text)}

.tools{flex:none;display:flex;align-items:stretch;padding:4px max(0px,var(--sar)) calc(4px + var(--sab)) max(0px,var(--sal));border-top:1px solid var(--line);background:#0b0b0c}

.tool:active{background:var(--panel)}

.tback{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted);border-inline-end:1px solid var(--line);margin-inline-end:2px}

.acards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px}
.acard{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.15}

.acard .a-none i{background:none;border:2px solid #636366;border-radius:50%}
.acard .aprev i{animation:1.6s ease-out infinite}
.a-fade i{animation-name:a-fade}.a-zoomin i{animation-name:a-zin}.a-zoomout i{animation-name:a-zout}.a-slideL i{animation-name:a-sl}.a-slideR i{animation-name:a-sr}.a-slideU i{animation-name:a-su}.a-slideD i{animation-name:a-sd}
.a-rotate i{animation-name:a-rot}.a-bounce i{animation-name:a-bnc}.a-blur i{animation-name:a-blur}.a-drop i{animation-name:a-drop}.a-swing i{animation-name:a-swing}.a-shrink i{animation-name:a-zout}.a-type i{animation-name:a-type}
.a-pulse i{animation:a-pulse 1s ease-in-out infinite}.a-sway i{animation:a-sway 1.6s ease-in-out infinite}.a-float i{animation:a-float 1.8s ease-in-out infinite}.a-shake i{animation:a-shake .4s linear infinite}.a-spin i{animation:a-spin 3s linear infinite}.a-breathe i{animation:a-pulse 2.4s ease-in-out infinite}.a-zoomloop i{animation:a-pulse 2s ease-in-out infinite}

@keyframes a-fade{0%{opacity:0}60%,100%{opacity:1}}@keyframes a-zin{0%{transform:scale(.3);opacity:0}60%,100%{transform:none;opacity:1}}@keyframes a-zout{0%{transform:scale(1.8);opacity:0}60%,100%{transform:none;opacity:1}}
@keyframes a-sl{0%{transform:translateX(160%);opacity:0}60%,100%{transform:none;opacity:1}}@keyframes a-sr{0%{transform:translateX(-160%);opacity:0}60%,100%{transform:none;opacity:1}}@keyframes a-su{0%{transform:translateY(160%);opacity:0}60%,100%{transform:none;opacity:1}}@keyframes a-sd{0%{transform:translateY(-160%);opacity:0}60%,100%{transform:none;opacity:1}}
@keyframes a-rot{0%{transform:rotate(-140deg) scale(.4);opacity:0}60%,100%{transform:none;opacity:1}}@keyframes a-bnc{0%{transform:translateY(-120%)}30%{transform:none}45%{transform:translateY(-40%)}60%,100%{transform:none}}
@keyframes a-blur{0%{filter:blur(6px);opacity:.2}60%,100%{filter:none;opacity:1}}@keyframes a-drop{0%{transform:translateY(-200%);opacity:0}50%,100%{transform:none;opacity:1}}@keyframes a-swing{0%{transform:rotate(25deg)}20%{transform:rotate(-18deg)}40%{transform:rotate(10deg)}60%,100%{transform:none}}

.cprev{width:100%;height:26px}.cprev path{fill:none;stroke:var(--accent-text);stroke-width:2}

.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--raised)}
.rec .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.rec.info .ic{background:var(--raised-2);color:var(--muted)}
.rec .grow{flex:1;min-width:0}
.rec .t{font-weight:600;font-size:15px}
.rec .d{font-size:13px;color:var(--muted);margin-top:2px}
.rec .btn{flex:none;max-width:42%;white-space:normal;line-height:1.15;padding:6px 12px;text-align:center;min-height:34px;font-size:14px}
.opt{font-size:11px;color:var(--muted);background:var(--raised-2);border-radius:5px;padding:1px 6px;margin-inline-start:4px;font-weight:500}
.help h4{margin:8px 0 2px;font-size:16px;font-weight:600}
.help p,.help li{color:var(--muted);font-size:15px;margin:0}
.help ol{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.shape{border:2px solid currentColor;border-radius:4px}
.shapes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.shp{aspect-ratio:1;border-radius:10px;background:var(--raised);display:grid;place-items:center;color:var(--text)}
.shp svg{width:26px;height:26px}
.shp:active{background:var(--raised-2)}
.phr{display:flex;flex-direction:column;gap:2px;align-items:stretch;padding:12px 14px;border-radius:12px;background:var(--raised);text-align:center}
.phr .ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:22px;line-height:1.6;direction:rtl;color:var(--text)}
.phr .en{font-size:12.5px;color:var(--muted)}
.phrases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phrases .wide{grid-column:1/-1}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.face{position:relative;border-radius:12px;background:var(--raised);padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;box-shadow:inset 0 0 0 2px transparent}
.face.on{box-shadow:inset 0 0 0 2px var(--accent-text)}
.face img,.face .ph0{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;background:var(--raised-2)}
.face .t{font-size:13px;font-weight:600}
.face .d{font-size:11.5px;color:var(--muted)}
.face .tag{position:absolute;top:10px;inset-inline-end:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}
.face:not(.on) .tag{background:rgba(0,0,0,.6);color:#fff}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shapes4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shp4{border-radius:10px;background:var(--raised);padding:9px 4px 7px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;font-weight:500;color:var(--muted);box-shadow:inset 0 0 0 2px transparent}
.shp4 svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}
.shp4.on{box-shadow:inset 0 0 0 2px var(--accent-text);color:var(--text)}
.shp4.on svg{stroke:var(--accent-text)}
.sty{border-radius:10px;background:var(--raised);padding:6px 6px 8px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12.5px;font-weight:500;color:var(--muted);box-shadow:inset 0 0 0 2px transparent}
.sty.on{box-shadow:inset 0 0 0 2px var(--accent-text);color:var(--text)}
.sty i{display:block;width:100%;height:40px;border-radius:7px}
.sec-title{font-size:13px;color:var(--muted);margin:2px 4px -10px}
.clips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.clips::-webkit-scrollbar{display:none}
.clip{flex:0 0 84px;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);text-align:center}
.clip .th{display:block;width:100%;height:84px;border-radius:9px;background:#2c2c2e center/cover;position:relative;box-shadow:inset 0 0 0 2px transparent}
.clip.on .th{box-shadow:inset 0 0 0 2px var(--accent-text)}
.clip .th b{position:absolute;inset-inline-start:5px;top:5px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:1px 5px}
.clip.add .th{display:grid;place-items:center;color:var(--accent-text);background:var(--raised)}

#toast{position:fixed;left:50%;top:calc(58px + var(--sat));transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:rgba(58,58,60,.96);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;pointer-events:auto;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.toast button{color:var(--accent-text);font-weight:600}
.acards.out .aprev i{animation-direction:reverse}

let UI_LANG = (() => { try { return localStorage.getItem('ve.lang') || ((navigator.language || '').startsWith('ar') ? 'ar' : 'en'); } catch (e) { return 'en'; } })();

      <span class="hint" style="text-align:center">${t('Use headphones so the video’s sound isn’t recorded again.')}</span>` };
  },
  voicefx: () => {
    const o = itemOf(), k = S.sel?.k, onItem = o && k === 'snd', curV = onItem ? o.voice || 'none' : cur().audio.vfx || 'none';
    return { title: t('Voice effects'), body: `<p class="lead">${onItem ? t('For this sound.') : t('For the video’s own sound.')}</p><div class="cards c3">${Object.entries(VOICES).map(([v, l]) => `<button class="card mini ${curV === v ? 'on' : ''}" data-act="ivoice" data-v="${v}"><span class="t">${t(l)}</span></button>`).join('')}</div>` };
  },
  canvas: () => {
    const p = cur(), bg = p.bgColor || '#000000';
    return { title: t('Canvas'), body: `<p class="lead">${t('What shows around the video when it doesn’t fill the frame.')}</p>
      <div class="field"><div class="lbl">${t('Style')}</div>${seg('fill', p.fill, [['crop', t('Fill (crop)')], ['blur', t('Blurred video')], ['color', t('Colour')]])}</div>
      ${p.fill === 'color' ? `<div class="field"><div class="lbl">${t('Colour')}</div>${swatches('bgcolor', bg)}</div>` : ''}` };

});
const curvePath = pts => { const X = x => (x * 56 + 2).toFixed(1), Y = v => (22 - clamp(Math.log2(v) / 2 + 0.5, 0, 1) * 20).toFixed(1); let d = ''; for (let i = 0; i <= 30; i++) { const x = i / 30; d += (i ? 'L' : 'M') + X(x) + ' ' + Y(curveAt(pts, x)); } return d; };

/* crop box from ratio, zoom and position */
function cropBox(o, vw, vh) {
  const c = o.crop; if (!c) return null; const R = { '1:1': 1, '9:16': 9 / 16, '16:9': 16 / 9, '4:5': 0.8, '3:4': 0.75, '4:3': 4 / 3, '2:1': 2 }[c.r] || vw / vh;
  let w = 1, h = (vw / R) / vh; if (h > 1) { h = 1; w = (vh * R) / vw; }
  w /= c.z || 1; h /= c.z || 1;
  return { ...c, x: (1 - w) * (c.px ?? 0.5), y: (1 - h) * (c.py ?? 0.5), w, h };
}
function itemDims(o, k) { if (k === 'seg') { const c = segClip(cur(), o); return [c.vw || 16, c.vh || 9]; } const m = OVM[o.id]?.el; return m ? [m.videoWidth || m.naturalWidth || 16, m.videoHeight || m.naturalHeight || 9] : [16, 9]; }

/* ---------- taps ---------- */
const itemSet = (label, fn) => { const o = selObj(); if (!o) return; commit(label); fn(o, S.sel.k); changed(); };
const previewItem = (where = 'start') => { const sp = selSpan(); if (!sp) return; seekOut(where === 'end' ? Math.max(sp.s, sp.s + sp.d - 1.2) : sp.s + 0.01); play(); clearTimeout(S.autoStop); S.autoStop = setTimeout(() => { if (S.playing && S.t >= sp.s + Math.min(sp.d, 2.5) - 0.05) pause(); }, Math.min(sp.d, 2.5) * 1000 + 300); };
Object.assign(ACT, {
  tool: el => openTool(el.dataset.v),
  desel: () => selectItem(null),
  menuback: () => { S.menu = null; renderTools(); },
  muteall: () => { const p = cur(); commit(p.audio.muteAll ? 'Sound on' : 'Mute clip sound'); p.audio.muteAll = !p.audio.muteAll; changed(); },
  trpick: el => { const i = +el.dataset.i, p = cur(); pause(); seekOut(Math.max(0, segStarts(p)[i] - 0.01)); openSheet('trone', { i }); },
  kf: () => toggleKey(),
  fullscreen: () => { const a = $('#app'); a.classList.toggle('full'); layoutFrame(); },
  spdtab: el => { S.sheetData.tab = el.dataset.v; renderSheet(); },
  ispeed: el => itemSet('Speed', (o, k) => { const v = +el.dataset.v; if (k === 'ov') o.dur = +(o.dur * (o.speed || 1) / v).toFixed(3); o.speed = v; if (k === 'seg') o.curve = null; }),
  icurve: el => { itemSet('Speed curve', o => { o.curve = el.dataset.v === 'none' ? null : { id: el.dataset.v }; }); previewItem(); },
  imute: () => itemSet('Mute', o => { o.mute = !o.mute; if (!o.mute && !o.vol) o.vol = 1; }),
  ivolall: () => { const p = cur(), o = selObj(p); commit('Volume'); p.segs.forEach(g => { g.vol = o.vol; g.mute = o.mute; }); changed(); toast(t('Done')); },
  animtab: el => { S.sheetData.tab = el.dataset.v; renderSheet(); },
  ianim: el => {
    const tab = el.dataset.k, v = el.dataset.v === 'none' ? null : el.dataset.v;
    itemSet('Animation', o => { const A = o.anim?.legacy ? { ...defaultAnim(), ...legacyAnim(o.anim.legacy) } : { ...defaultAnim(), ...(o.anim || {}) }; delete A.legacy; A[tab] = v; if (tab === 'in' && v === 'type') A.inD = Math.max(A.inD, 1); o.anim = A; });
    if (v) previewItem(tab === 'out' ? 'end' : 'start');
  },
  icrop: el => { const v = el.dataset.v; itemSet('Crop', (o, k) => { if (v === 'reset') { o.crop = null; return; } const [vw, vh] = itemDims(o, k); o.crop = cropBox({ crop: { r: v, z: o.crop?.z || 1, px: o.crop?.px ?? 0.5, py: o.crop?.py ?? 0.5 } }, vw, vh); if (v === 'free' && (o.crop.z || 1) === 1) o.crop = null; }); },
  irot90: () => itemSet('Rotate', (o, k) => setVal(k, o, 'rot', (((Math.round((getVal(k, o, 'rot') || 0) / 90) * 90 + 90) + 180) % 360) - 180)),
  iflip: el => itemSet('Mirror', o => { if (el.dataset.v === 'h') o.flipH = !o.flipH; else o.flipV = !o.flipV; }),
  ixreset: () => itemSet('Reset', (o, k) => { o.keys = []; o.rot = 0; o.opacity = 1; if (k === 'seg') { o.px = o.py = 0.5; o.zoom = 1; } else if (k === 'ov') { o.x = o.y = 0.5; o.scale = 0.5; } else { o.x = o.y = null; o.size = 1; } }),
  iblend: el => itemSet('Blend', o => o.blend = el.dataset.v),
  ilook: el => itemSet('Filter', o => { o.look = el.dataset.v === 'none' ? null : el.dataset.v; }),
  iadjreset: () => itemSet('Reset', o => o.adj = {}),
  imask: el => itemSet('Mask', o => { o.mask = el.dataset.v === 'none' ? null : { size: 0.5, x: 0.5, y: 0.5, rot: 0, feather: 0.1, ...(o.mask || {}), type: el.dataset.v }; }),
  imaskinv: () => itemSet('Mask', o => o.mask.invert = !o.mask.invert),
  ichroma: el => itemSet('Chroma key', o => { o.chroma = { color: '#00ff00', strength: 0.4, soft: 0.3, ...(o.chroma || {}), on: el.checked }; }),
  ichromacol: el => itemSet('Chroma colour', o => { o.chroma = { strength: 0.4, soft: 0.3, ...(o.chroma || {}), on: true, color: el.dataset.v }; }),
  ichromapick: () => { S.pickColor = true; toast(t('Tap the colour on the video')); },
  ifxtype: el => itemSet('Effect', o => o.type = el.dataset.v),
  ivoice: el => { const o = selObj(); if (o && S.sel.k === 'snd') itemSet('Voice effect', x => x.voice = el.dataset.v); else auSet('Voice effect', a => a.vfx = el.dataset.v); },
  sfxplay: async el => { try { ensurePreviewAudio(); const b = makeSfx(el.dataset.v); SNDB['sfx:' + el.dataset.v] = b; const s = S.ac.createBufferSource(); s.buffer = b; s.connect(S.ac.destination); s.start(); } catch (e) { } },
  sfxadd: el => { const k = el.dataset.v; addSound({ kind: 'sfx', sfx: k, name: t(SFX[k].n), dur: SFX[k].d, label: 'Add sound' }); closeSheet(); toast(t('{x} added at {t}', { x: t(SFX[k].n), t: fmt(S.t) })); },
  recstart: () => startVoiceOver(), recstop: () => stopVoiceOver(),
  bgcolor: el => { const p = cur(); commit('Background'); p.bgColor = el.dataset.v; changed(); },
});
/* the sliders in these panels */
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset?.k; if (!k || !k.startsWith('i.')) return;
  const o = selObj(), sk = S.sel?.k, v = +el.value; if (!o) return;
  const L = (label, fn, shown) => { live(label, () => fn(o)); if (shown != null) showVal(k, shown); };
  switch (k) {
    case 'i.speedx': { const s = xToSpeed(v); L('Speed', o => { if (sk === 'ov') o.dur = +(o.dur * (o.speed || 1) / s).toFixed(3); o.speed = s; if (sk === 'seg') o.curve = null; }, fmtX(s)); break; }
    case 'i.vol': L('Volume', o => { o.vol = v; o.mute = v === 0; }, pct(v)); break;
    case 'i.fadeIn': L('Fade', o => o.fadeIn = v, v.toFixed(1) + 's'); break;
    case 'i.fadeOut': L('Fade', o => o.fadeOut = v, v.toFixed(1) + 's'); break;
    case 'i.inD': L('Animation', o => { o.anim = { ...defaultAnim(), ...(o.anim?.legacy ? legacyAnim(o.anim.legacy) : o.anim) }; delete o.anim.legacy; o.anim.inD = v; }, v.toFixed(1) + 's'); break;
    case 'i.outD': L('Animation', o => { o.anim = { ...defaultAnim(), ...(o.anim?.legacy ? legacyAnim(o.anim.legacy) : o.anim) }; delete o.anim.legacy; o.anim.outD = v; }, v.toFixed(1) + 's'); break;
    case 'i.cz': case 'i.cx': case 'i.cy': L('Crop', o => { const [vw, vh] = itemDims(o, sk); const c = { r: 'free', z: 1, px: 0.5, py: 0.5, ...(o.crop || {}) }; c[{ 'i.cz': 'z', 'i.cx': 'px', 'i.cy': 'py' }[k]] = v; o.crop = cropBox({ crop: c }, vw, vh); }, k === 'i.cz' ? pct(v) : ''); break;
    case 'i.scale': L('Size', o => setVal(sk, o, 'scale', v), pct(v)); break;
    case 'i.rot': L('Rotate', o => setVal(sk, o, 'rot', v), Math.round(v) + '°'); break;
    case 'i.opacity': L('Opacity', o => setVal(sk, o, 'opacity', v), pct(v)); break;
    default:
      if (k.startsWith('i.adj.')) { const f = k.slice(6); L('Adjust', o => { o.adj = { ...(o.adj || {}), [f]: v }; }, ['warmth', 'tint'].includes(f) ? signed(v) : pct(v)); }
      else if (k.startsWith('i.mask.')) { const f = k.slice(7); L('Mask', o => { o.mask = { ...(o.mask || {}), [f]: v }; }, f === 'rot' ? Math.round(v) + '°' : ['x', 'y'].includes(f) ? '' : pct(v)); }
      else if (k.startsWith('i.chroma.')) { const f = k.slice(9); L('Chroma key', o => { o.chroma = { ...(o.chroma || {}), [f]: v }; }, pct(v)); }
  }
});

/* ---------- overlays: add a photo or video on top ---------- */
async function addOverlayFile(file) {
  const p = cur(); if (!p || !file) return;
  const isImg = /^image\//.test(file.type), id = uid('o'), url = URL.createObjectURL(file);
  let dur = 4, vw = 0, vh = 0, thumb = '';
  try {
    if (isImg) { const im = new Image(); await new Promise((r, j) => { im.onload = r; im.onerror = j; im.src = url; }); vw = im.naturalWidth; vh = im.naturalHeight; thumb = smallThumb(im, vw, vh); }
    else { const v = hiddenVideo(url); await videoReady(v, 12000); dur = v.duration; vw = v.videoWidth; vh = v.videoHeight; v.currentTime = Math.min(0.5, dur / 2); await Promise.race([once(v, 'seeked'), sleep(2000)]); thumb = smallThumb(v, vw, vh); v.remove(); }
  } catch (e) { URL.revokeObjectURL(url); toast(t('“{x}” couldn’t be opened', { x: file.name })); return; }
  URL.revokeObjectURL(url);
  if (!isFinite(dur) || !dur) dur = 4;
  commit('Add overlay'); S.files['ov:' + id] = file; DB.putVideo('ov:' + id, file);
  const remaining = Math.max(1, outDur(p) - S.t);
  const o = { id, kind: isImg ? 'image' : 'video', name: file.name.replace(/\.[^.]+$/, ''), start: +S.t.toFixed(2), dur: +Math.min(isImg ? 4 : dur, isImg ? Math.max(1, remaining) : 1e9).toFixed(2), in: 0, srcDur: isImg ? null : dur, speed: 1, scale: 0.5, x: 0.5, y: 0.5, rot: 0, opacity: 1, vol: 1, blend: 'normal', anim: defaultAnim(), keys: [], thumb };
  p.overlays.push(o); S.sel = { k: 'ov', id }; S.menu = null; changed(); toast(t('Overlay added. Drag it on the video, pinch to resize.'));
}
function smallThumb(el, vw, vh) { try { const c = document.createElement('canvas'), h = 40; c.height = h; c.width = Math.max(10, Math.round(h * vw / vh)); c.getContext('2d').drawImage(el, 0, 0, c.width, h); return c.toDataURL('image/jpeg', 0.6); } catch (e) { return ''; } }
/* replace a clip (or an overlay) with another video, keeping its length and settings */
async function replaceWith(file) {
  const p = cur(), id = S.replaceId; S.replaceId = null; if (!file) return;
  const o = p.segs.find(g => g.id === id);
  if (o) {
    const before = p.clips.length; await addClips([file], true); const c = p.clips[p.clips.length - 1]; if (p.clips.length === before) return;
    const len = o.freeze ? 0 : o.out - o.in; commit('Replace');
    // addClips put the new clip at the end: take its part off the end and use it here
    const added = p.segs.filter(g => segClip(p, g).id === c.id); p.segs = p.segs.filter(g => !added.includes(g));
    o.in = c.off; o.out = c.off + Math.min(c.dur, len || c.dur); if (o.freeze) o.out = o.in;
    changed(); seekOut(S.t); toast(t('Clip replaced')); return;
  }
  const ov = p.overlays.find(x => x.id === id);
  if (ov) { commit('Replace'); S.files['ov:' + ov.id] = file; DB.putVideo('ov:' + ov.id, file); delete OVM[ov.id]; ov.kind = /^image\//.test(file.type) ? 'image' : 'video'; ov.in = 0; changed(); }
}

$('#ovpicker').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; addOverlayFile(f); });
$('#sndpicker').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f && cur()) { const s = await addSoundFile(f, 'file'); if (s) { S.menu = null; renderTools(); toast(t('Sound added at {t}', { t: fmt(s.start) })); } } });
$('#replacepicker').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; replaceWith(f); });
